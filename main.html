<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="wrapper">

    <!-- Video -->
    <video
      class="flex"
      width="765"
      height="430"
      src="https://www.w3schools.com/html/mov_bbb.mp4">
    </video>

    <!-- Progress Bar -->
    <div class="progress">
      <div class="progress__filled"></div>
    </div>

    <!-- Controls -->
    <div class="player__controls">

      <!-- Play / Pause -->
      <button class="player__button toggle">►</button>

      <!-- Volume -->
      <input
        type="range"
        class="volume"
        min="0"
        max="1"
        step="0.01"
        value="1">

      <!-- Playback Speed -->
      <input
        type="range"
        class="playbackSpeed"
        min="0.5"
        max="2"
        step="0.1"
        value="1">

      <!-- Rewind 10 seconds -->
      <button data-skip="-10">« 10s</button>

      <!-- Forward 25 seconds -->
      <button data-skip="25">25s »</button>

    </div>

  </div>


<script  src="./script.js">
  //Your code goes here
</script>
</body>
</html>
